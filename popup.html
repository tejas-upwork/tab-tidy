<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 360px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f4f1;
    color: #23201c;
    font-size: 14px;
  }
  header {
    background: linear-gradient(135deg, #3a2418, #211310);
    color: #f8f1e7;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header img { width: 32px; height: 32px; border-radius: 8px; }
  header h1 { font-size: 17px; font-weight: 700; }
  header p { font-size: 12px; opacity: .7; }
  main { padding: 14px 16px 18px; }
  .btn {
    display: block; width: 100%;
    border: none; border-radius: 10px;
    padding: 12px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: filter .15s, transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: #c9853e; color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-danger { background: #b3402e; color: #fff; margin-top: 10px; }
  .btn-danger:hover { filter: brightness(1.08); }
  .btn:disabled { background: #cfc6bb; color: #8a8078; cursor: not-allowed; transform: none; }
  .status {
    margin-top: 12px; font-size: 13px; text-align: center;
    min-height: 20px; color: #6b5f54;
  }
  .status.ok { color: #2f7a3d; font-weight: 600; }
  .group-list { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
  .group {
    background: #fff; border: 1px solid #e5ddd2;
    border-radius: 10px; padding: 10px 12px;
  }
  .group-title {
    font-weight: 600; font-size: 13px; margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group-meta { font-size: 12px; color: #8a8078; margin-bottom: 8px; }
  .group-meta b { color: #b3402e; }
  .tab-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #6b5f54; padding: 3px 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab-row img { width: 14px; height: 14px; flex-shrink: 0; }
  .badge-kept {
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
    background: #e7f2e4; color: #2f7a3d;
    padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
  }
  .badge-dup {
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
    background: #fbe9e4; color: #b3402e;
    padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
  }
  .empty {
    text-align: center; padding: 26px 10px; color: #8a8078;
  }
  .empty .big { font-size: 34px; margin-bottom: 8px; }
  footer {
    padding: 10px 16px 14px; font-size: 11px; color: #a89c8e; text-align: center;
  }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="Tab Tidy icon">
    <div>
      <h1>Tab Tidy</h1>
      <p>Close duplicate tabs in one click</p>
    </div>
  </header>
  <main>
    <button class="btn btn-primary" id="scanBtn">Scan for duplicate tabs</button>
    <div class="status" id="status" role="status"></div>
    <div class="group-list" id="groupList"></div>
    <button class="btn btn-danger" id="closeBtn" disabled>Close duplicates</button>
  </main>
  <footer>Pinned &amp; active tabs are always kept.</footer>
  <script src="popup.js"></script>
</body>
</html>
